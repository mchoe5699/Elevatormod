name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        id: build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Report build errors
        if: failure()
        run: |
          grep -E "error:|What went wrong|Could not" -A4 build.log | head -c 50000 > errors.txt || true
          if [ ! -s errors.txt ]; then tail -c 30000 build.log > errors.txt; fi
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' errors.txt)
          echo "::error title=Build errors::$msg"
          tail -c 20000 build.log > tail.txt
          msg2=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' tail.txt)
          echo "::warning title=Build log tail::$msg2"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: qwertys_elevator-jar
          path: build/libs/*.jar
      - name: Publish jar to release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: build/libs/*.jar
          prerelease: true
      - name: Game tests
        id: gametest
        if: always() && steps.build.outcome == 'success'
        run: |
          set +e
          timeout 1500 ./gradlew runGameTestServer --no-daemon > gametest.log 2>&1
          code=$?
          grep -E "GameTest|gametest|failed|passed|Exception|ERROR|Error|Caused by|at com.qwerty" gametest.log | grep -v "DEBUG" | head -c 50000 > gt.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' gt.txt)
          if ! grep -q "required tests passed" gametest.log; then code=1; fi
          if [ $code -ne 0 ]; then echo "::error title=Game tests::exit $code%0A$msg"; else echo "::notice title=Game tests::$msg"; fi
          exit $code
      - name: Client screenshots
        if: always() && steps.build.outcome == 'success'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null 2>&1
          mkdir -p run
          printf "onboardAccessibility:false\ntutorialStep:none\nskipMultiplayerWarning:true\njoinedFirstServer:true\nrenderDistance:5\nsimulationDistance:8\nguiScale:2\nnarrator:0\nsoundCategory_master:0.0\npauseOnLostFocus:false\nfov:0.15\n" > run/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1
          set +e
          timeout 1800 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --no-daemon -Pautotest=true > client.log 2>&1
          echo "exit $?"
          ls run/screenshots || true
          grep -E "AUTOTEST|Exception|ERROR|Caused by|at com.qwerty|Reported exception|qwertys_elevator" client.log | grep -vE "Narrator|flite|setAccessible|netty|Suppressed|IllegalAccessException|at jdk|at java" | head -c 45000 > ct.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' ct.txt)
          echo "::notice title=Client run::$msg"
          tail -c 15000 client.log > ctail.txt
          msg2=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' ctail.txt)
          echo "::notice title=Client tail::$msg2"
      - name: Publish screenshots
        if: always() && steps.build.outcome == 'success' && hashFiles('run/screenshots/*.png') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: screens-${{ github.run_number }}
          name: Screenshots ${{ github.run_number }}
          files: run/screenshots/*.png
          prerelease: true
