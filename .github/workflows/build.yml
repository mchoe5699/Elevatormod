name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Publish build log on failure
        if: failure()
        run: |
          grep -E "error:|warning:|FAILURE|What went wrong|Exception" -A4 build.log | head -1500 > errors.txt || true
          tail -300 build.log > tail.txt || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-logs || true
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . > /dev/null
          mkdir -p logs && cp errors.txt tail.txt logs/
          git add logs
          git commit -m "build log ${{ github.run_number }}"
          git push -f origin HEAD:ci-logs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: qwertys_elevator-jar
          path: build/libs/*.jar
      - name: Publish jar to release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: build/libs/*.jar
          prerelease: true
