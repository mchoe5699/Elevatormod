name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Report build errors
        if: failure()
        run: |
          grep -E "error:|What went wrong|Could not" -A4 build.log | head -c 50000 > errors.txt || true
          if [ ! -s errors.txt ]; then tail -c 30000 build.log > errors.txt; fi
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' errors.txt)
          echo "::error title=Build errors::$msg"
          tail -c 20000 build.log > tail.txt
          msg2=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' tail.txt)
          echo "::warning title=Build log tail::$msg2"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: qwertys_elevator-jar
          path: build/libs/*.jar
      - name: Publish jar to release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: build/libs/*.jar
          prerelease: true
